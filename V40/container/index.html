<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novatrix kundtj&auml;nst</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1f2d3d; }
    h1 { color: #2f5496; }
    p { color: #4a5568; }
    .info { background: #e8eef9; border-left: 4px solid #2f5496; padding: 10px 14px; color: #1f2d3d; }
    form { display: grid; gap: 12px; margin-top: 24px; }
    label { font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 180px; padding: 10px; background: #2f5496; color: #fff; border: none; }
    button:disabled { background: #9aa9c7; }
    footer { margin-top: 32px; font-size: 0.9em; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Novatrix kundtj&auml;nst</h1>
  <p>Skicka in ett &auml;rende s&aring; &aring;terkommer vi s&aring; snart vi kan.</p>

  <p class="info">
    Den h&auml;r sidan k&ouml;rs som en <strong>container</strong> i
    Azure Container Instances, inte p&aring; en virtuell maskin.
    Mottagningen av &auml;renden (<code>/submit</code>) &auml;r inte kopplad
    i den h&auml;r versionen.
  </p>

  <form>
    <label for="name">Namn</label>
    <input type="text" id="name" name="name">

    <label for="mail">E-post</label>
    <input type="email" id="mail" name="mail">

    <label for="msg">Meddelande</label>
    <textarea id="msg" name="msg" rows="5"></textarea>

    <label for="bild">Bifoga en bild</label>
    <input type="file" id="bild" name="bild">

    <button type="submit" disabled>Skicka &auml;rende</button>
  </form>

  <footer>Image: novatrix-web:v1 &middot; Niv&aring;: container (ACI) &middot; V40</footer>
</body>
</html>
